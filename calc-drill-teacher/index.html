<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>선생님 페이지</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; background: #f5f6f8; color:#222; min-height:100vh; }
  .header { background:#3C1E1E; color:#fff; padding:16px 20px; display:flex; align-items:center; justify-content:space-between; }
  .header-title { font-size:17px; font-weight:700; }
  .tabs { display:flex; background:#fff; border-bottom:1px solid #e5e5e5; overflow-x:auto; }
  .tab { padding:14px 18px; font-size:14px; font-weight:600; color:#888; cursor:pointer; white-space:nowrap; border-bottom:3px solid transparent; }
  .tab.active { color:#3C1E1E; border-bottom-color:#FEE500; }
  .container { max-width:720px; margin:0 auto; padding:20px 16px 60px; }
  .card { background:#fff; border-radius:14px; padding:18px; margin-bottom:14px; box-shadow:0 2px 10px rgba(0,0,0,.05); }
  .card-title { font-size:15px; font-weight:700; margin-bottom:14px; }
  label { font-size:13px; color:#555; margin-bottom:6px; display:block; }
  input[type=text], input[type=password], input[type=number], select, textarea {
    width:100%; padding:10px 12px; border:1.5px solid #e0e0e0; border-radius:8px; font-size:14px; font-family:inherit; outline:none;
  }
  input:focus, select:focus, textarea:focus { border-color:#FEE500; }
  .row { display:flex; gap:8px; }
  .mb-2 { margin-bottom:8px; } .mb-3 { margin-bottom:12px; } .mt-2 { margin-top:8px; }
  .btn { padding:9px 16px; border:none; border-radius:8px; font-size:13px; font-weight:700; cursor:pointer; }
  .btn-primary { background:#FEE500; color:#3C1E1E; }
  .btn-secondary { background:#fff; color:#555; border:1.5px solid #ddd; }
  .btn-danger { background:#fee2e2; color:#b91c1c; }
  .btn-block { width:100%; padding:13px; }
  .chip { display:inline-block; padding:5px 12px; border-radius:999px; font-size:12px; border:1.5px solid #ddd; background:#fff; color:#666; cursor:pointer; margin:2px; }
  .chip.selected { background:#FEE500; border-color:#FEE500; color:#3C1E1E; }
  .list-item { display:flex; align-items:center; justify-content:space-between; padding:12px 14px; border-radius:10px; background:#fafafa; margin-bottom:8px; }
  .list-item .name { font-weight:600; font-size:14px; }
  .list-item .meta { font-size:12px; color:#999; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:6px 4px; border-bottom:1px solid #f0f0f0; }
  th { color:#888; font-weight:600; }
  .hidden { display:none; }
  .q-box { border:1.5px solid #eee; border-radius:10px; padding:14px; margin-bottom:10px; }
  .q-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
  .q-head b { font-size:13px; }
  .link-danger { color:#ef4444; font-size:12px; cursor:pointer; }
  .radio-row { display:flex; gap:16px; margin-bottom:10px; font-size:13px; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .choice-select { display:flex; gap:6px; flex-wrap:wrap; }
  .choice-select button { width:34px; height:34px; border-radius:50%; border:1.5px solid #ddd; background:#fff; font-size:13px; cursor:pointer; }
  .choice-select button.selected { background:#FEE500; border-color:#FEE500; color:#3C1E1E; font-weight:700; }
  .err { color:#ef4444; font-size:13px; margin-top:8px; }
  .msg-ok { color:#16a34a; font-size:13px; margin-top:8px; }
  .pw-visible { font-family:monospace; }
  #screenLogin { max-width:360px; margin:80px auto 0; }
  .modal-ov { display:none; position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:999; align-items:center; justify-content:center; padding:16px; }
  .modal-ov.show { display:flex; }
  .modal-bx { background:#fff; border-radius:16px; width:100%; max-width:360px; box-shadow:0 16px 48px rgba(0,0,0,.25); }
  .modal-hd { padding:16px 20px; border-bottom:1px solid #eee; display:flex; justify-content:space-between; align-items:center; }
  .modal-hd b { font-size:15px; }
  .modal-hd button { background:none; border:none; font-size:20px; cursor:pointer; color:#999; }
  .modal-bd { padding:18px 20px; }
  .modal-ft { padding:14px 20px; border-top:1px solid #eee; display:flex; gap:8px; justify-content:flex-end; }
  .table-actions button { margin-right:6px; }
</style>
</head>
<body>

<!-- 비밀번호 게이트 -->
<div id="screenLogin" class="container">
  <div class="card">
    <div class="card-title">선생님 로그인</div>
    <input type="password" id="pwInput" placeholder="비밀번호" class="mb-3">
    <button class="btn btn-primary btn-block" id="pwBtn">확인</button>
    <div class="err hidden" id="pwErr">비밀번호가 올바르지 않습니다.</div>
  </div>
</div>

<!-- 메인 화면 -->
<div id="screenMain" class="hidden">
  <div class="header">
    <div class="header-title">선생님 페이지</div>
  </div>
  <div class="tabs">
    <div class="tab active" data-tab="worksheets">학습지 관리</div>
    <div class="tab" data-tab="results">결과 보기</div>
    <div class="tab" data-tab="students">학생 관리</div>
  </div>

  <div class="container">

    <!-- 학습지 관리 -->
    <div id="tabWorksheets">
      <div id="wsListView">
        <div class="card">
          <div class="card-title">학습지 목록</div>
          <button class="btn btn-primary mb-3" id="newWsBtn">+ 새 학습지</button>
          <div class="grid2 mb-3">
            <select id="wsFilterClass"><option value="">전체 반</option></select>
            <select id="wsSortMode">
              <option value="date_desc">최신순</option>
              <option value="date_asc">오래된순</option>
              <option value="class">반별로 묶기</option>
            </select>
          </div>
          <div id="wsList"></div>
        </div>
      </div>
      <div id="wsEditorView" class="hidden"></div>
    </div>

    <!-- 결과 보기 -->
    <div id="tabResults" class="hidden">
      <div class="card">
        <div class="card-title">결과 보기</div>
        <div class="grid2 mb-3">
          <select id="resultClassSelect"><option value="">전체 반</option></select>
          <select id="resultStudentSelect"><option value="">학생 선택</option></select>
        </div>
        <div id="resultDetail"></div>
      </div>
    </div>

    <!-- 학생 관리 (반 관리 통합) -->
    <div id="tabStudents" class="hidden">
      <div class="card">
        <div class="card-title" style="display:flex;justify-content:space-between;align-items:center">
          <span>반 목록</span>
          <button class="btn btn-secondary" id="addClassBtn">+ 반 추가</button>
        </div>
        <div id="classChipsRow" style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px"></div>
        <div id="classActionsRow" style="display:flex;gap:8px"></div>
      </div>
      <div class="card">
        <div class="card-title" style="display:flex;justify-content:space-between;align-items:center">
          <span id="studentListTitle">학생 목록</span>
          <button class="btn btn-primary" id="openStudentAddBtn">+ 학생 추가</button>
        </div>
        <div id="studentListArea"></div>
      </div>
    </div>

  </div>
</div>

<!-- 학생 추가/수정 모달 -->
<div class="modal-ov" id="studentModal">
  <div class="modal-bx">
    <div class="modal-hd"><b id="studentModalTitle">학생 추가</b><button id="studentModalCloseBtn">&times;</button></div>
    <div class="modal-bd">
      <input type="hidden" id="stuEditId">
      <label>이름 *</label>
      <input type="text" id="stuNameInput" placeholder="학생 이름" class="mb-3">
      <label>반</label>
      <select id="stuClassInput" class="mb-3"><option value="">반 없음</option></select>
      <label>연락처</label>
      <input type="text" id="stuPhoneInput" placeholder="010-0000-0000" class="mb-3">
      <label>학번 (로그인 아이디) *</label>
      <input type="text" id="stuNoInput" placeholder="예: 1" class="mb-3">
      <label>비밀번호 (기본: 전화번호 뒤 4자리)</label>
      <input type="text" id="stuPwInput" placeholder="예: 1234">
      <div style="font-size:11px;color:#999;margin-top:4px">학생이 처음 로그인하면 비밀번호 변경을 요청받습니다.</div>
      <div class="err hidden" id="stuModalErr"></div>
    </div>
    <div class="modal-ft">
      <button class="btn btn-secondary" id="studentModalCancelBtn">취소</button>
      <button class="btn btn-primary" id="studentModalSaveBtn">저장</button>
    </div>
  </div>
</div>

<!-- 배정 학생(명단) 수정 모달 -->
<div class="modal-ov" id="rosterModal">
  <div class="modal-bx" style="max-width:420px">
    <div class="modal-hd"><b>배정 학생 수정</b><button id="rosterModalCloseBtn">&times;</button></div>
    <div class="modal-bd" id="rosterModalBody"></div>
    <div class="modal-ft">
      <button class="btn btn-secondary" id="rosterModalCancelBtn">취소</button>
      <button class="btn btn-primary" id="rosterModalSaveBtn">저장</button>
    </div>
  </div>
</div>

<script>
// =========================================================
// 설정 — 본인 값으로 교체하세요
// =========================================================
const SUPABASE_URL = 'https://obgdwtsykchxjbtvqssn.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9iZ2R3dHN5a2NoeGpidHZxc3NuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYzNjEwMzEsImV4cCI6MjEwMTkzNzAzMX0.T8NuPqDk1NZfawzP9sIJGu2iyJYFlGPLvMt4T2cuPpQ';
const TEACHER_PW   = '2424'; // 선생님 페이지 접속 비밀번호 (원하는 값으로 변경)

const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_KEY);

// =========================================================
// 로그인 게이트
// =========================================================
document.getElementById('pwBtn').addEventListener('click', tryLogin);
document.getElementById('pwInput').addEventListener('keydown', e => { if (e.key === 'Enter') tryLogin(); });
function tryLogin() {
  const val = document.getElementById('pwInput').value;
  if (val === TEACHER_PW) {
    sessionStorage.setItem('teacher_ok', '1');
    document.getElementById('screenLogin').classList.add('hidden');
    document.getElementById('screenMain').classList.remove('hidden');
    initAll();
  } else {
    document.getElementById('pwErr').classList.remove('hidden');
  }
}
if (sessionStorage.getItem('teacher_ok') === '1') {
  document.getElementById('screenLogin').classList.add('hidden');
  document.getElementById('screenMain').classList.remove('hidden');
  initAll();
}

// =========================================================
// 탭 전환
// =========================================================
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    ['Worksheets','Results','Students'].forEach(name => {
      document.getElementById('tab' + name).classList.toggle('hidden', 'tab' + name !== 'tab' + capitalize(tab.dataset.tab));
    });
  });
});
function capitalize(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

let allClasses = [];
let allTags = [];
let allStudents = [];
let selectedClassId = ''; // '' = 전체, '__none__' = 반 없음, 그 외 = class id

async function initAll() {
  await loadClasses();
  loadTags();
  loadWorksheetsList();
  loadStudentList();
  loadResultClassOptions();
}

// =========================================================
// 학생 관리 (반 관리 통합)
// =========================================================
async function loadClasses() {
  const { data } = await db.from('classes').select('*').order('created_at');
  allClasses = data || [];
  renderClassChipsRow();
  renderNewStudentClassSelect();
}

function renderClassChipsRow() {
  const row = document.getElementById('classChipsRow');
  if (!row) return;
  row.innerHTML = '';
  const items = [{ id: '', name: '전체' }, ...allClasses, { id: '__none__', name: '반 없음' }];
  items.forEach(c => {
    const chip = document.createElement('span');
    chip.className = 'chip' + (selectedClassId === c.id ? ' selected' : '');
    chip.textContent = c.name;
    chip.onclick = () => {
      selectedClassId = c.id;
      renderClassChipsRow();
      renderClassActionsRow();
      renderStudentListArea();
    };
    row.appendChild(chip);
  });
  renderClassActionsRow();
}

function renderClassActionsRow() {
  const row = document.getElementById('classActionsRow');
  if (!row) return;
  row.innerHTML = '';
  if (!selectedClassId || selectedClassId === '__none__') return;
  const cls = allClasses.find(c => c.id === selectedClassId);
  if (!cls) return;
  const renameBtn = document.createElement('button');
  renameBtn.className = 'btn btn-secondary'; renameBtn.textContent = '이 반 이름변경';
  renameBtn.onclick = async () => {
    const name = prompt('새 반 이름', cls.name);
    if (name && name.trim()) { await db.from('classes').update({ name: name.trim() }).eq('id', cls.id); loadClasses(); }
  };
  const delBtn = document.createElement('button');
  delBtn.className = 'btn btn-danger'; delBtn.textContent = '이 반 삭제';
  delBtn.onclick = async () => {
    if (!confirm(cls.name + ' 반을 삭제할까요? (소속 학생은 반 없음으로 남습니다)')) return;
    await db.from('classes').delete().eq('id', cls.id);
    selectedClassId = '';
    loadClasses();
    loadStudentList();
  };
  row.appendChild(renameBtn); row.appendChild(delBtn);
}

document.getElementById('addClassBtn').addEventListener('click', async () => {
  const name = prompt('새 반 이름 (예: 월수반)');
  if (!name || !name.trim()) return;
  await db.from('classes').insert({ name: name.trim() });
  loadClasses();
});

function renderNewStudentClassSelect() {
  const sel = document.getElementById('stuClassInput');
  if (!sel) return;
  const prev = sel.value;
  sel.innerHTML = '<option value="">반 없음</option>';
  allClasses.forEach(c => {
    const opt = document.createElement('option');
    opt.value = c.id; opt.textContent = c.name;
    sel.appendChild(opt);
  });
  if (prev) sel.value = prev;
}

function openStudentModal(student) {
  document.getElementById('stuModalErr').classList.add('hidden');
  document.getElementById('studentModalTitle').textContent = student ? '학생 수정' : '학생 추가';
  document.getElementById('stuEditId').value = student ? student.id : '';
  document.getElementById('stuNameInput').value = student ? student.name : '';
  const defaultClass = selectedClassId && selectedClassId !== '__none__' ? selectedClassId : '';
  document.getElementById('stuClassInput').value = student ? (student.class_id || '') : defaultClass;
  document.getElementById('stuPhoneInput').value = student ? (student.phone || '') : '';
  document.getElementById('stuNoInput').value = student ? (student.student_no || '') : '';
  document.getElementById('stuPwInput').value = student ? (student.password || '') : '';
  document.getElementById('studentModal').dataset.origPw = student ? (student.password || '') : '';
  document.getElementById('studentModal').classList.add('show');
}
function closeStudentModal() {
  document.getElementById('studentModal').classList.remove('show');
}
document.getElementById('openStudentAddBtn').addEventListener('click', () => openStudentModal(null));
document.getElementById('studentModalCloseBtn').addEventListener('click', closeStudentModal);
document.getElementById('studentModalCancelBtn').addEventListener('click', closeStudentModal);
document.getElementById('studentModalSaveBtn').addEventListener('click', async () => {
  const id = document.getElementById('stuEditId').value;
  const name = document.getElementById('stuNameInput').value.trim();
  const classId = document.getElementById('stuClassInput').value || null;
  const phone = document.getElementById('stuPhoneInput').value.trim();
  const studentNo = document.getElementById('stuNoInput').value.trim();
  let password = document.getElementById('stuPwInput').value.trim();
  const errEl = document.getElementById('stuModalErr');
  errEl.classList.add('hidden');
  if (!name) { errEl.textContent = '이름을 입력해주세요'; errEl.classList.remove('hidden'); return; }
  if (!studentNo) { errEl.textContent = '학번을 입력해주세요'; errEl.classList.remove('hidden'); return; }

  if (!password) {
    const digits = phone.replace(/[^0-9]/g, '');
    password = digits.length >= 4 ? digits.slice(-4) : '0000';
  }

  const origPw = document.getElementById('studentModal').dataset.origPw || '';
  const payload = { name, class_id: classId, phone: phone || null, student_no: studentNo, password };
  if (password !== origPw) payload.must_change_password = true;

  const { error } = id
    ? await db.from('students').update(payload).eq('id', id)
    : await db.from('students').insert(payload);
  if (error) { errEl.textContent = '저장 실패: ' + error.message; errEl.classList.remove('hidden'); return; }
  closeStudentModal();
  loadStudentList();
});

async function loadStudentList() {
  const { data } = await db
    .from('students')
    .select('id, name, class_id, phone, student_no, password, must_change_password, classes(id, name)')
    .order('created_at');
  allStudents = data || [];
  renderStudentListArea();
}

function renderStudentListArea() {
  const el = document.getElementById('studentListArea');
  if (!el) return;
  const titleEl = document.getElementById('studentListTitle');
  let list = allStudents;
  if (selectedClassId === '__none__') list = allStudents.filter(s => !s.class_id);
  else if (selectedClassId) list = allStudents.filter(s => s.class_id === selectedClassId);
  if (titleEl) {
    const label = selectedClassId === '' ? '전체'
      : selectedClassId === '__none__' ? '반 없음'
      : (allClasses.find(c => c.id === selectedClassId)?.name || '');
    titleEl.textContent = '학생 목록 (' + label + ' · ' + list.length + '명)';
  }
  el.innerHTML = '';
  if (!list.length) {
    el.innerHTML = '<div style="font-size:13px;color:#999;padding:8px 0">학생이 없습니다.</div>';
    return;
  }
  list.forEach(s => {
    const div = document.createElement('div');
    div.className = 'list-item';
    div.style.flexDirection = 'column';
    div.style.alignItems = 'stretch';

    const top = document.createElement('div');
    top.style.display = 'flex'; top.style.justifyContent = 'space-between'; top.style.alignItems = 'center';
    const className = s.classes ? s.classes.name : '반 없음';
    top.innerHTML = `<span class="name">${s.name}</span><span class="meta">${className}</span>`;
    div.appendChild(top);

    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.style.marginTop = '4px';
    const pwSpan = document.createElement('span');
    pwSpan.textContent = '••••';
    const pwToggle = document.createElement('button');
    pwToggle.className = 'link-danger';
    pwToggle.style.color = '#3C1E1E';
    pwToggle.textContent = '비밀번호 보기';
    let shown = false;
    pwToggle.onclick = () => {
      shown = !shown;
      pwSpan.textContent = shown ? (s.password || '-') : '••••';
      pwToggle.textContent = shown ? '숨기기' : '비밀번호 보기';
    };
    meta.textContent = `학번 ${s.student_no || '-'} · 연락처 ${s.phone || '-'} · 비밀번호 `;
    meta.appendChild(pwSpan);
    meta.appendChild(document.createTextNode(' '));
    meta.appendChild(pwToggle);
    div.appendChild(meta);

    const btnRow = document.createElement('div');
    btnRow.style.marginTop = '8px'; btnRow.style.display = 'flex'; btnRow.style.gap = '6px';
    const editBtn = document.createElement('button');
    editBtn.className = 'btn btn-secondary'; editBtn.textContent = '수정';
    editBtn.onclick = () => openStudentModal(s);
    const delBtn = document.createElement('button');
    delBtn.className = 'btn btn-danger'; delBtn.textContent = '삭제';
    delBtn.onclick = async () => {
      if (!confirm(s.name + ' 학생을 삭제할까요?')) return;
      await db.from('students').delete().eq('id', s.id);
      loadStudentList();
    };
    btnRow.appendChild(editBtn); btnRow.appendChild(delBtn);
    div.appendChild(btnRow);

    el.appendChild(div);
  });
}

// =========================================================
// 태그
// =========================================================
async function loadTags() {
  const { data } = await db.from('tags').select('*').order('created_at');
  allTags = data || [];
}
async function addTag(name) {
  const { data } = await db.from('tags').insert({ name }).select().single();
  allTags.push(data);
  return data;
}

// =========================================================
// 학습지 관리
// =========================================================
let allWorksheetsData = [];

async function loadWorksheetsList() {
  const { data } = await db
    .from('worksheets')
    .select('*, questions(id), worksheet_students(student_id, students(id, name, class_id, classes(id, name)))')
    .order('created_at', { ascending: false });
  allWorksheetsData = data || [];
  populateWsFilterClass();
  renderWorksheetsList();
}

function populateWsFilterClass() {
  const sel = document.getElementById('wsFilterClass');
  if (!sel) return;
  const prev = sel.value;
  sel.innerHTML = '<option value="">전체 반</option>';
  allClasses.forEach(c => {
    const opt = document.createElement('option'); opt.value = c.id; opt.textContent = c.name;
    sel.appendChild(opt);
  });
  if (prev) sel.value = prev;
}
document.getElementById('wsFilterClass').addEventListener('change', renderWorksheetsList);
document.getElementById('wsSortMode').addEventListener('change', renderWorksheetsList);

function worksheetMeta(w) {
  const students = (w.worksheet_students || []).map(x => x.students).filter(Boolean);
  const classNames = [...new Set(students.map(s => s.classes?.name).filter(Boolean))];
  const studentNames = students.map(s => s.name);
  return { students, classNames, studentNames };
}

function renderWorksheetsList() {
  const el = document.getElementById('wsList');
  const filterClass = document.getElementById('wsFilterClass').value;
  const sortMode = document.getElementById('wsSortMode').value;
  el.innerHTML = '';

  let list = allWorksheetsData.filter(w => {
    if (!filterClass) return true;
    const { students } = worksheetMeta(w);
    return students.some(s => s.class_id === filterClass);
  });

  const renderRow = (w, container) => {
    const { classNames, studentNames } = worksheetMeta(w);
    const dateStr = w.created_at ? String(w.created_at).slice(0, 10) : '-';
    const div = document.createElement('div');
    div.className = 'list-item';
    div.style.flexDirection = 'column';
    div.style.alignItems = 'stretch';

    const top = document.createElement('div');
    top.style.display = 'flex'; top.style.justifyContent = 'space-between'; top.style.alignItems = 'center';
    top.innerHTML = `<span class="name">${w.title} <span class="meta">(${(w.questions || []).length}문항)</span></span>`;
    div.appendChild(top);

    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.style.marginTop = '4px';
    meta.textContent = `출제일 ${dateStr} · 반 ${classNames.length ? classNames.join(', ') : '미배정'} · 학생 ${studentNames.length ? studentNames.join(', ') : '없음'}`;
    div.appendChild(meta);

    const btns = document.createElement('div');
    btns.style.marginTop = '8px'; btns.style.display = 'flex'; btns.style.gap = '6px'; btns.style.flexWrap = 'wrap';
    const editBtn = document.createElement('button');
    editBtn.className = 'btn btn-secondary'; editBtn.textContent = '편집';
    editBtn.onclick = () => openWorksheetEditor(w.id);
    const rosterBtn = document.createElement('button');
    rosterBtn.className = 'btn btn-secondary'; rosterBtn.textContent = '명단 수정';
    rosterBtn.onclick = () => openRosterModal(w.id, worksheetMeta(w).students.map(s => s.id));
    const cloneBtn = document.createElement('button');
    cloneBtn.className = 'btn btn-secondary'; cloneBtn.textContent = '복제';
    cloneBtn.onclick = async () => { await cloneWorksheet(w.id); };
    const delBtn = document.createElement('button');
    delBtn.className = 'btn btn-danger'; delBtn.textContent = '삭제';
    delBtn.onclick = async () => {
      if (!confirm('이 학습지를 삭제할까요?')) return;
      await db.from('worksheets').delete().eq('id', w.id);
      loadWorksheetsList();
    };
    btns.appendChild(editBtn); btns.appendChild(rosterBtn); btns.appendChild(cloneBtn); btns.appendChild(delBtn);
    div.appendChild(btns);
    container.appendChild(div);
  };

  if (sortMode === 'class') {
    const groups = {};
    list.forEach(w => {
      const { classNames } = worksheetMeta(w);
      const key = classNames.length ? classNames.join(', ') : '미배정';
      if (!groups[key]) groups[key] = [];
      groups[key].push(w);
    });
    Object.keys(groups).sort().forEach(key => {
      const h = document.createElement('div');
      h.style.fontWeight = '700'; h.style.fontSize = '13px'; h.style.margin = '10px 0 4px';
      h.textContent = key;
      el.appendChild(h);
      groups[key].forEach(w => renderRow(w, el));
    });
  } else {
    list = [...list].sort((a, b) => sortMode === 'date_asc'
      ? new Date(a.created_at) - new Date(b.created_at)
      : new Date(b.created_at) - new Date(a.created_at));
    list.forEach(w => renderRow(w, el));
  }

  if (!list.length) el.innerHTML = '<div style="font-size:13px;color:#999;padding:8px 0">학습지가 없습니다.</div>';
}

// 명단(배정 학생)만 수정하는 모달
let rosterWorksheetId = null;
let rosterSelected = [];
function openRosterModal(worksheetId, currentStudentIds) {
  rosterWorksheetId = worksheetId;
  rosterSelected = [...currentStudentIds];
  renderRosterModalBody();
  document.getElementById('rosterModal').classList.add('show');
}
function closeRosterModal() {
  document.getElementById('rosterModal').classList.remove('show');
}
function renderRosterModalBody() {
  const body = document.getElementById('rosterModalBody');
  body.innerHTML = '';
  const groups = allClasses
    .map(c => ({ cls: c, students: allStudents.filter(s => s.class_id === c.id) }))
    .filter(g => g.students.length > 0);
  const noClassStudents = allStudents.filter(s => !s.class_id);
  if (noClassStudents.length) groups.push({ cls: { id: '', name: '반 없음' }, students: noClassStudents });

  if (!groups.length) {
    body.innerHTML = '<div style="font-size:13px;color:#999">등록된 학생이 없습니다.</div>';
    return;
  }

  groups.forEach(g => {
    const groupDiv = document.createElement('div');
    groupDiv.className = 'mb-3';
    const allIn = g.students.every(s => rosterSelected.includes(s.id));

    const headerRow = document.createElement('div');
    headerRow.style.display = 'flex'; headerRow.style.justifyContent = 'space-between';
    headerRow.style.alignItems = 'center'; headerRow.style.marginBottom = '6px';
    const label = document.createElement('b');
    label.style.fontSize = '13px'; label.textContent = g.cls.name;
    const toggleBtn = document.createElement('button');
    toggleBtn.className = 'btn btn-secondary';
    toggleBtn.style.padding = '4px 10px'; toggleBtn.style.fontSize = '12px';
    toggleBtn.textContent = allIn ? '전체 해제' : '전체 선택';
    toggleBtn.onclick = () => {
      const ids = g.students.map(s => s.id);
      rosterSelected = allIn ? rosterSelected.filter(id => !ids.includes(id)) : [...new Set([...rosterSelected, ...ids])];
      renderRosterModalBody();
    };
    headerRow.appendChild(label); headerRow.appendChild(toggleBtn);
    groupDiv.appendChild(headerRow);

    const chipsRow = document.createElement('div');
    g.students.forEach(s => {
      const chip = document.createElement('span');
      chip.className = 'chip' + (rosterSelected.includes(s.id) ? ' selected' : '');
      chip.textContent = s.name;
      chip.onclick = () => {
        rosterSelected = rosterSelected.includes(s.id) ? rosterSelected.filter(x => x !== s.id) : [...rosterSelected, s.id];
        renderRosterModalBody();
      };
      chipsRow.appendChild(chip);
    });
    groupDiv.appendChild(chipsRow);
    body.appendChild(groupDiv);
  });
}
document.getElementById('rosterModalCloseBtn').addEventListener('click', closeRosterModal);
document.getElementById('rosterModalCancelBtn').addEventListener('click', closeRosterModal);
document.getElementById('rosterModalSaveBtn').addEventListener('click', async () => {
  await db.from('worksheet_students').delete().eq('worksheet_id', rosterWorksheetId);
  if (rosterSelected.length > 0) {
    await db.from('worksheet_students').insert(rosterSelected.map(student_id => ({ worksheet_id: rosterWorksheetId, student_id })));
  }
  closeRosterModal();
  loadWorksheetsList();
});
async function cloneWorksheet(id) {
  const { data: original } = await db.from('worksheets').select('*, questions(*)').eq('id', id).single();
  const { data: clone } = await db.from('worksheets').insert({ title: original.title + ' (복사본)' }).select().single();
  if (original.questions?.length) {
    await db.from('questions').insert(original.questions.map(q => ({
      worksheet_id: clone.id, question_no: q.question_no, type: q.type,
      correct_choice: q.correct_choice, correct_value: q.correct_value,
      tolerance: q.tolerance, tag_id: q.tag_id
    })));
  }
  loadWorksheetsList();
}

document.getElementById('newWsBtn').addEventListener('click', () => openWorksheetEditor(null));

let editorQuestions = [];
let editorWorksheetId = null;

async function openWorksheetEditor(id) {
  editorWorksheetId = id;
  document.getElementById('wsListView').classList.add('hidden');
  const view = document.getElementById('wsEditorView');
  view.classList.remove('hidden');

  let title = '';
  let assignedStudentIds = [];
  if (id) {
    const { data: w } = await db.from('worksheets').select('*, questions(*)').eq('id', id).single();
    title = w.title;
    editorQuestions = (w.questions || []).sort((a,b)=>a.question_no-b.question_no).map(q => ({
      type: q.type, correct_choice: q.correct_choice, correct_value: q.correct_value || '',
      answer_prefix: q.answer_prefix || '', answer_suffix: q.answer_suffix || '',
      tolerance: q.tolerance ?? 0, tag_id: q.tag_id || ''
    }));
    const { data: ws } = await db.from('worksheet_students').select('student_id').eq('worksheet_id', id);
    assignedStudentIds = (ws || []).map(r => r.student_id);
  } else {
    editorQuestions = [emptyQuestion()];
  }

  renderEditor(title, assignedStudentIds);
}
function emptyQuestion() { return { type:'mc', correct_choice:1, correct_value:'', answer_prefix:'', answer_suffix:'', tolerance:0, tag_id:'' }; }

function renderEditor(title, assignedStudentIds) {
  const view = document.getElementById('wsEditorView');
  view.innerHTML = '';

  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <div class="card-title">${editorWorksheetId ? '학습지 편집' : '새 학습지'}</div>
    <label>학습지 제목</label>
    <input type="text" id="wsTitleInput" class="mb-3" value="${title.replace(/"/g,'&quot;')}">
    <div class="row mb-3">
      <div style="flex:1">
        <label>문항 수</label>
        <input type="number" id="wsQCount" min="1" value="${editorQuestions.length}">
      </div>
    </div>
    <label>실수 유형 태그 추가</label>
    <div class="row mb-3">
      <input type="text" id="newTagInput" placeholder="예: 부호 실수">
      <button class="btn btn-secondary" id="addTagBtn">추가</button>
    </div>
  `;
  view.appendChild(card);

  const pdfCard = document.createElement('div');
  pdfCard.className = 'card';
  pdfCard.innerHTML = `
    <div class="card-title">PDF로 자동 생성 (AI, 검토 필요)</div>
    <div style="font-size:12px;color:#999;margin-bottom:10px">문제와 정답이 있는 PDF를 올리면 AI가 문항을 자동으로 채워줍니다. AI가 실수할 수 있으니 반드시 아래 문항 목록에서 확인·수정한 뒤 저장하세요.</div>
    <input type="file" accept="application/pdf" id="pdfInput" class="mb-2">
    <button class="btn btn-secondary" id="pdfParseBtn">자동 생성</button>
    <div id="pdfStatus" style="font-size:13px;margin-top:8px"></div>
  `;
  view.appendChild(pdfCard);

  const qContainer = document.createElement('div');
  qContainer.id = 'qContainer';
  view.appendChild(qContainer);
  renderQuestionBoxes();

  const addBtn = document.createElement('button');
  addBtn.className = 'btn btn-secondary mb-3';
  addBtn.textContent = '+ 문항 추가';
  addBtn.onclick = () => { editorQuestions.push(emptyQuestion()); document.getElementById('wsQCount').value = editorQuestions.length; renderQuestionBoxes(); };
  view.appendChild(addBtn);

  // 배정 (반 선택 → 그 반 학생들 중 개별 선택)
  const assignCard = document.createElement('div');
  assignCard.className = 'card';
  assignCard.innerHTML = `<div class="card-title">배정할 학생</div><div style="font-size:12px;color:#999;margin-bottom:10px">반 이름 옆 "전체 선택"으로 한번에 고르거나, 학생을 개별로 선택할 수 있습니다.</div><div id="assignGroups"></div>`;
  view.appendChild(assignCard);
  const assignGroups = assignCard.querySelector('#assignGroups');
  let selectedAssign = [...assignedStudentIds];
  function renderAssignGroups() {
    assignGroups.innerHTML = '';
    const groups = allClasses
      .map(c => ({ cls: c, students: allStudents.filter(s => s.class_id === c.id) }))
      .filter(g => g.students.length > 0);
    const noClassStudents = allStudents.filter(s => !s.class_id);
    if (noClassStudents.length) groups.push({ cls: { id: '', name: '반 없음' }, students: noClassStudents });

    if (!groups.length) {
      assignGroups.innerHTML = '<div style="font-size:13px;color:#999">등록된 학생이 없습니다. 먼저 학생 관리에서 학생을 추가하세요.</div>';
      return;
    }

    groups.forEach(g => {
      const groupDiv = document.createElement('div');
      groupDiv.className = 'mb-3';
      const allIn = g.students.every(s => selectedAssign.includes(s.id));

      const headerRow = document.createElement('div');
      headerRow.style.display = 'flex'; headerRow.style.justifyContent = 'space-between';
      headerRow.style.alignItems = 'center'; headerRow.style.marginBottom = '6px';
      const label = document.createElement('b');
      label.style.fontSize = '13px'; label.textContent = g.cls.name;
      const toggleBtn = document.createElement('button');
      toggleBtn.className = 'btn btn-secondary';
      toggleBtn.style.padding = '4px 10px'; toggleBtn.style.fontSize = '12px';
      toggleBtn.textContent = allIn ? '전체 해제' : '전체 선택';
      toggleBtn.onclick = () => {
        const ids = g.students.map(s => s.id);
        selectedAssign = allIn ? selectedAssign.filter(id => !ids.includes(id)) : [...new Set([...selectedAssign, ...ids])];
        renderAssignGroups();
      };
      headerRow.appendChild(label); headerRow.appendChild(toggleBtn);
      groupDiv.appendChild(headerRow);

      const chipsRow = document.createElement('div');
      g.students.forEach(s => {
        const chip = document.createElement('span');
        chip.className = 'chip' + (selectedAssign.includes(s.id) ? ' selected' : '');
        chip.textContent = s.name;
        chip.onclick = () => {
          selectedAssign = selectedAssign.includes(s.id) ? selectedAssign.filter(x => x !== s.id) : [...selectedAssign, s.id];
          renderAssignGroups();
        };
        chipsRow.appendChild(chip);
      });
      groupDiv.appendChild(chipsRow);
      assignGroups.appendChild(groupDiv);
    });
  }
  renderAssignGroups();

  const saveRow = document.createElement('div');
  saveRow.className = 'row';
  const saveBtn = document.createElement('button');
  saveBtn.className = 'btn btn-primary btn-block';
  saveBtn.textContent = '저장';
  saveBtn.onclick = () => saveWorksheet(selectedAssign);
  const cancelBtn = document.createElement('button');
  cancelBtn.className = 'btn btn-secondary';
  cancelBtn.textContent = '취소';
  cancelBtn.style.marginLeft = '8px';
  cancelBtn.onclick = closeEditor;
  saveRow.appendChild(saveBtn); saveRow.appendChild(cancelBtn);
  view.appendChild(saveRow);
  const errDiv = document.createElement('div'); errDiv.id = 'wsErr'; errDiv.className='err hidden';
  view.appendChild(errDiv);

  document.getElementById('wsQCount').addEventListener('change', (e) => {
    const n = Math.max(1, Number(e.target.value) || 1);
    while (editorQuestions.length < n) editorQuestions.push(emptyQuestion());
    while (editorQuestions.length > n) editorQuestions.pop();
    renderQuestionBoxes();
  });
  document.getElementById('addTagBtn').addEventListener('click', async () => {
    const input = document.getElementById('newTagInput');
    if (!input.value.trim()) return;
    await addTag(input.value.trim());
    input.value = '';
    renderQuestionBoxes();
  });

  document.getElementById('pdfParseBtn').addEventListener('click', async () => {
    const fileInput = document.getElementById('pdfInput');
    const statusEl = document.getElementById('pdfStatus');
    const file = fileInput.files[0];
    if (!file) { statusEl.textContent = 'PDF 파일을 선택해주세요.'; statusEl.style.color = '#ef4444'; return; }
    statusEl.textContent = '분석 중입니다... (10~30초 정도 걸릴 수 있어요)';
    statusEl.style.color = '#888';
    try {
      const base64 = await fileToBase64(file);
      const resp = await fetch('/api/parse-worksheet', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ pdfBase64: base64 })
      });
      const data = await resp.json();
      if (!resp.ok) { statusEl.textContent = data.error || '분석에 실패했습니다.'; statusEl.style.color = '#ef4444'; return; }
      if (!data.questions || !data.questions.length) { statusEl.textContent = '문항을 찾지 못했습니다. 수동으로 입력해주세요.'; statusEl.style.color = '#ef4444'; return; }
      editorQuestions = data.questions.map(q => ({
        type: q.type === 'mc' ? 'mc' : 'short',
        correct_choice: q.type === 'mc' ? (q.correct_choice || 1) : 1,
        correct_value: q.type === 'short' ? (q.correct_value || '') : '',
        answer_prefix: q.type === 'short' ? (q.answer_prefix || '') : '',
        answer_suffix: q.type === 'short' ? (q.answer_suffix || '') : '',
        tolerance: 0,
        tag_id: ''
      }));
      document.getElementById('wsQCount').value = editorQuestions.length;
      renderQuestionBoxes();
      statusEl.textContent = editorQuestions.length + '개 문항을 채웠습니다. 앞/뒤 고정 표시도 AI가 자동으로 채웠을 수 있으니, 아래에서 꼭 확인·수정한 뒤 저장하세요.';
      statusEl.style.color = '#16a34a';
    } catch (e) {
      statusEl.textContent = '오류: ' + e.message;
      statusEl.style.color = '#ef4444';
    }
  });
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result).split(',')[1] || '');
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function renderQuestionBoxes() {
  const container = document.getElementById('qContainer');
  container.innerHTML = '';
  editorQuestions.forEach((q, idx) => {
    const box = document.createElement('div');
    box.className = 'q-box';
    const head = document.createElement('div');
    head.className = 'q-head';
    head.innerHTML = `<b>${idx+1}번 문항</b>`;
    const delLink = document.createElement('span');
    delLink.className = 'link-danger'; delLink.textContent = '삭제';
    delLink.onclick = () => { editorQuestions.splice(idx,1); document.getElementById('wsQCount').value = editorQuestions.length; renderQuestionBoxes(); };
    head.appendChild(delLink);
    box.appendChild(head);

    const radioRow = document.createElement('div');
    radioRow.className = 'radio-row';
    radioRow.innerHTML = `
      <label style="display:flex;align-items:center;gap:4px;"><input type="radio" name="type${idx}" ${q.type==='mc'?'checked':''}> 객관식(5지선다)</label>
      <label style="display:flex;align-items:center;gap:4px;"><input type="radio" name="type${idx}" ${q.type==='short'?'checked':''}> 주관식</label>
    `;
    const radios = radioRow.querySelectorAll('input[type=radio]');
    radios[0].onchange = () => { q.type = 'mc'; renderQuestionBoxes(); };
    radios[1].onchange = () => { q.type = 'short'; renderQuestionBoxes(); };
    box.appendChild(radioRow);

    if (q.type === 'mc') {
      const sel = document.createElement('div');
      sel.className = 'choice-select';
      for (let n=1;n<=5;n++) {
        const b = document.createElement('button');
        b.type='button'; b.textContent = n;
        if (q.correct_choice === n) b.classList.add('selected');
        b.onclick = () => { q.correct_choice = n; renderQuestionBoxes(); };
        sel.appendChild(b);
      }
      box.appendChild(sel);
    } else {
      const grid = document.createElement('div');
      grid.className = 'grid2';
      grid.innerHTML = `
        <div><label>정답(핵심 값만)</label><input type="text" class="ansInput" placeholder="예: 1/2, 2√3, 3, 150" value="${(q.correct_value||'').replace(/"/g,'&quot;')}"></div>
        <div><label>허용 오차</label><input type="number" step="0.001" class="tolInput" value="${q.tolerance}"></div>
      `;
      grid.querySelector('.ansInput').addEventListener('input', e => q.correct_value = e.target.value);
      grid.querySelector('.tolInput').addEventListener('input', e => q.tolerance = Number(e.target.value));
      box.appendChild(grid);

      const fixWrap = document.createElement('div');
      fixWrap.className = 'grid2 mt-2';
      fixWrap.innerHTML = `
        <div><label>답 앞 고정 표시(선택)</label><input type="text" class="prefixInput" placeholder="예: 제" value="${(q.answer_prefix||'').replace(/"/g,'&quot;')}"></div>
        <div><label>답 뒤 고정 표시(선택)</label><input type="text" class="suffixInput" placeholder="예: 사분면, m" value="${(q.answer_suffix||'').replace(/"/g,'&quot;')}"></div>
      `;
      fixWrap.querySelector('.prefixInput').addEventListener('input', e => q.answer_prefix = e.target.value);
      fixWrap.querySelector('.suffixInput').addEventListener('input', e => q.answer_suffix = e.target.value);
      box.appendChild(fixWrap);
      const fixHint = document.createElement('div');
      fixHint.style.fontSize = '11px'; fixHint.style.color = '#999'; fixHint.style.marginTop = '4px';
      fixHint.textContent = '학생 화면에 "앞고정 [입력칸] 뒤고정" 형태로 표시되고, 학생은 빈칸에 정답(핵심 값)만 입력하면 됩니다.';
      box.appendChild(fixHint);
    }

    const tagWrap = document.createElement('div');
    tagWrap.className = 'mt-2';
    tagWrap.innerHTML = `<label>실수 유형 태그</label>`;
    const tagSel = document.createElement('select');
    const noneOpt = document.createElement('option'); noneOpt.value=''; noneOpt.textContent='태그 없음';
    tagSel.appendChild(noneOpt);
    allTags.forEach(t => {
      const opt = document.createElement('option'); opt.value = t.id; opt.textContent = t.name;
      if (q.tag_id === t.id) opt.selected = true;
      tagSel.appendChild(opt);
    });
    tagSel.addEventListener('change', e => q.tag_id = e.target.value);
    tagWrap.appendChild(tagSel);
    box.appendChild(tagWrap);

    container.appendChild(box);
  });
}

async function saveWorksheet(assignedStudentIds) {
  const errEl = document.getElementById('wsErr');
  errEl.classList.add('hidden');
  const title = document.getElementById('wsTitleInput').value.trim();
  if (!title) { errEl.textContent = '학습지 제목을 입력하세요.'; errEl.classList.remove('hidden'); return; }
  for (const q of editorQuestions) {
    if (q.type === 'short' && !String(q.correct_value||'').trim()) {
      errEl.textContent = '모든 주관식 문항에 정답을 입력하세요.'; errEl.classList.remove('hidden'); return;
    }
  }

  let worksheetId = editorWorksheetId;
  if (worksheetId) {
    await db.from('worksheets').update({ title }).eq('id', worksheetId);
    await db.from('questions').delete().eq('worksheet_id', worksheetId);
  } else {
    const { data: w, error } = await db.from('worksheets').insert({ title }).select().single();
    if (error) { errEl.textContent = '저장 실패: ' + error.message; errEl.classList.remove('hidden'); return; }
    worksheetId = w.id;
  }

  const rows = editorQuestions.map((q, idx) => ({
    worksheet_id: worksheetId, question_no: idx+1, type: q.type,
    correct_choice: q.type === 'mc' ? q.correct_choice : null,
    correct_value: q.type === 'short' ? String(q.correct_value).trim() : null,
    answer_prefix: q.type === 'short' ? (String(q.answer_prefix||'').trim() || null) : null,
    answer_suffix: q.type === 'short' ? (String(q.answer_suffix||'').trim() || null) : null,
    tolerance: q.tolerance ?? 0,
    tag_id: q.tag_id || null
  }));
  await db.from('questions').insert(rows);

  await db.from('worksheet_students').delete().eq('worksheet_id', worksheetId);
  if (assignedStudentIds.length > 0) {
    await db.from('worksheet_students').insert(assignedStudentIds.map(student_id => ({ worksheet_id: worksheetId, student_id })));
  }

  closeEditor();
  loadWorksheetsList();
}
function closeEditor() {
  document.getElementById('wsEditorView').classList.add('hidden');
  document.getElementById('wsListView').classList.remove('hidden');
}

// =========================================================
// 결과 보기
// =========================================================
async function loadResultClassOptions() {
  const sel = document.getElementById('resultClassSelect');
  sel.innerHTML = '<option value="">전체 반</option>';
  allClasses.forEach(c => {
    const opt = document.createElement('option'); opt.value = c.id; opt.textContent = c.name;
    sel.appendChild(opt);
  });
}
document.getElementById('resultClassSelect').addEventListener('change', loadResultStudentOptions);
document.getElementById('resultStudentSelect').addEventListener('change', loadResultDetail);

async function loadResultStudentOptions() {
  const classId = document.getElementById('resultClassSelect').value;
  const sel = document.getElementById('resultStudentSelect');
  sel.innerHTML = '<option value="">학생 선택</option>';
  document.getElementById('resultDetail').innerHTML = '';

  let students;
  if (classId) {
    const { data } = await db.from('students').select('id, name').eq('class_id', classId);
    students = data || [];
  } else {
    const { data } = await db.from('students').select('id, name');
    students = data || [];
  }
  students.sort((a,b)=>a.name.localeCompare(b.name)).forEach(s => {
    const opt = document.createElement('option'); opt.value = s.id; opt.textContent = s.name;
    sel.appendChild(opt);
  });
}

async function loadResultDetail() {
  const studentId = document.getElementById('resultStudentSelect').value;
  const detailEl = document.getElementById('resultDetail');
  detailEl.innerHTML = '';
  if (!studentId) return;

  const { data: attempts } = await db
    .from('attempts')
    .select('id, worksheet_id, attempt_no, wrong_count, passed, worksheets(title)')
    .eq('student_id', studentId)
    .order('attempt_no');

  const byWs = {};
  (attempts||[]).forEach(a => {
    const key = a.worksheet_id;
    if (!byWs[key]) byWs[key] = { title: a.worksheets?.title || '(삭제된 학습지)', rows: [] };
    byWs[key].rows.push(a);
  });

  Object.values(byWs).forEach(w => {
    const wrap = document.createElement('div'); wrap.className = 'mb-3';
    let rowsHtml = w.rows.map(a => `<tr><td>${a.attempt_no}차</td><td>${a.wrong_count}개</td><td>${a.passed ? '<span style="color:#16a34a">통과</span>' : '<span style="color:#ef4444">재시도</span>'}</td></tr>`).join('');
    wrap.innerHTML = `<b style="font-size:13px;">${w.title}</b><table class="mt-2"><thead><tr><th>시도</th><th>틀린 문항 수</th><th>결과</th></tr></thead><tbody>${rowsHtml}</tbody></table>`;
    detailEl.appendChild(wrap);
  });
  if (Object.keys(byWs).length === 0) {
    detailEl.innerHTML = '<p style="font-size:13px;color:#999;">아직 푼 학습지가 없습니다.</p>';
    return;
  }

  const attemptIds = (attempts||[]).map(a => a.id);
  if (attemptIds.length > 0) {
    const { data: wrongAnswers } = await db
      .from('attempt_answers')
      .select('questions(tag_id, tags(name))')
      .in('attempt_id', attemptIds)
      .eq('is_correct', false);
    const counts = {};
    (wrongAnswers||[]).forEach(r => {
      const tag = r.questions?.tags;
      if (!tag) return;
      counts[tag.name] = (counts[tag.name]||0) + 1;
    });
    const tagStats = Object.entries(counts).sort((a,b)=>b[1]-a[1]);
    if (tagStats.length > 0) {
      const tagWrap = document.createElement('div');
      tagWrap.innerHTML = '<b style="font-size:13px;">유형별 오답 경향</b>' +
        tagStats.map(([name,count]) => `<div style="display:flex;justify-content:space-between;font-size:13px;padding:4px 0;"><span>${name}</span><span style="color:#999;">${count}회</span></div>`).join('');
      detailEl.appendChild(tagWrap);
    }
  }
}
</script>
