<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>선생님 페이지</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; background: #f5f6f8; color:#222; min-height:100vh; }
  .header { background:#3C1E1E; color:#fff; padding:16px 20px; display:flex; align-items:center; justify-content:space-between; }
  .header-title { font-size:17px; font-weight:700; }
  .tabs { display:flex; background:#fff; border-bottom:1px solid #e5e5e5; overflow-x:auto; }
  .tab { padding:14px 18px; font-size:14px; font-weight:600; color:#888; cursor:pointer; white-space:nowrap; border-bottom:3px solid transparent; }
  .tab.active { color:#3C1E1E; border-bottom-color:#FEE500; }
  .container { max-width:720px; margin:0 auto; padding:20px 16px 60px; }
  .card { background:#fff; border-radius:14px; padding:18px; margin-bottom:14px; box-shadow:0 2px 10px rgba(0,0,0,.05); }
  .card-title { font-size:15px; font-weight:700; margin-bottom:14px; }
  label { font-size:13px; color:#555; margin-bottom:6px; display:block; }
  input[type=text], input[type=password], input[type=number], select, textarea {
    width:100%; padding:10px 12px; border:1.5px solid #e0e0e0; border-radius:8px; font-size:14px; font-family:inherit; outline:none;
  }
  input:focus, select:focus, textarea:focus { border-color:#FEE500; }
  .row { display:flex; gap:8px; }
  .mb-2 { margin-bottom:8px; } .mb-3 { margin-bottom:12px; } .mt-2 { margin-top:8px; }
  .btn { padding:9px 16px; border:none; border-radius:8px; font-size:13px; font-weight:700; cursor:pointer; }
  .btn-primary { background:#FEE500; color:#3C1E1E; }
  .btn-secondary { background:#fff; color:#555; border:1.5px solid #ddd; }
  .btn-danger { background:#fee2e2; color:#b91c1c; }
  .btn-block { width:100%; padding:13px; }
  .chip { display:inline-block; padding:5px 12px; border-radius:999px; font-size:12px; border:1.5px solid #ddd; background:#fff; color:#666; cursor:pointer; margin:2px; }
  .chip.selected { background:#FEE500; border-color:#FEE500; color:#3C1E1E; }
  .list-item { display:flex; align-items:center; justify-content:space-between; padding:12px 14px; border-radius:10px; background:#fafafa; margin-bottom:8px; }
  .list-item .name { font-weight:600; font-size:14px; }
  .list-item .meta { font-size:12px; color:#999; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:6px 4px; border-bottom:1px solid #f0f0f0; }
  th { color:#888; font-weight:600; }
  .hidden { display:none; }
  .q-box { border:1.5px solid #eee; border-radius:10px; padding:14px; margin-bottom:10px; }
  .q-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
  .q-head b { font-size:13px; }
  .link-danger { color:#ef4444; font-size:12px; cursor:pointer; }
  .radio-row { display:flex; gap:16px; margin-bottom:10px; font-size:13px; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .choice-select { display:flex; gap:6px; flex-wrap:wrap; }
  .choice-select button { width:34px; height:34px; border-radius:50%; border:1.5px solid #ddd; background:#fff; font-size:13px; cursor:pointer; }
  .choice-select button.selected { background:#FEE500; border-color:#FEE500; color:#3C1E1E; font-weight:700; }
  .err { color:#ef4444; font-size:13px; margin-top:8px; }
  .msg-ok { color:#16a34a; font-size:13px; margin-top:8px; }
  .pw-visible { font-family:monospace; }
  #screenLogin { max-width:360px; margin:80px auto 0; }
  .modal-ov { display:none; position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:999; align-items:center; justify-content:center; padding:16px; }
  .modal-ov.show { display:flex; }
  .modal-bx { background:#fff; border-radius:16px; width:100%; max-width:360px; box-shadow:0 16px 48px rgba(0,0,0,.25); }
  .modal-hd { padding:16px 20px; border-bottom:1px solid #eee; display:flex; justify-content:space-between; align-items:center; }
  .modal-hd b { font-size:15px; }
  .modal-hd button { background:none; border:none; font-size:20px; cursor:pointer; color:#999; }
  .modal-bd { padding:18px 20px; }
  .modal-ft { padding:14px 20px; border-top:1px solid #eee; display:flex; gap:8px; justify-content:flex-end; }
  .table-actions button { margin-right:6px; }
</style>
</head>
<body>

<!-- 비밀번호 게이트 -->
<div id="screenLogin" class="container">
  <div class="card">
    <div class="card-title">선생님 로그인</div>
    <input type="password" id="pwInput" placeholder="비밀번호" class="mb-3">
    <button class="btn btn-primary btn-block" id="pwBtn">확인</button>
    <div class="err hidden" id="pwErr">비밀번호가 올바르지 않습니다.</div>
  </div>
</div>

<!-- 메인 화면 -->
<div id="screenMain" class="hidden">
  <div class="header">
    <div class="header-title">선생님 페이지</div>
  </div>
  <div class="tabs">
    <div class="tab active" data-tab="worksheets">학습지 관리</div>
    <div class="tab" data-tab="results">결과 보기</div>
    <div class="tab" data-tab="students">학생 관리</div>
    <div class="tab" data-tab="classes">반 관리</div>
  </div>

  <div class="container">

    <!-- 학습지 관리 -->
    <div id="tabWorksheets">
      <div id="wsListView">
        <div class="card">
          <div class="card-title">학습지 목록</div>
          <button class="btn btn-primary mb-3" id="newWsBtn">+ 새 학습지</button>
          <div id="wsList"></div>
        </div>
      </div>
      <div id="wsEditorView" class="hidden"></div>
    </div>

    <!-- 결과 보기 -->
    <div id="tabResults" class="hidden">
      <div class="card">
        <div class="card-title">결과 보기</div>
        <div class="grid2 mb-3">
          <select id="resultClassSelect"><option value="">전체 반</option></select>
          <select id="resultStudentSelect"><option value="">학생 선택</option></select>
        </div>
        <div id="resultDetail"></div>
      </div>
    </div>

    <!-- 학생 관리 -->
    <div id="tabStudents" class="hidden">
      <div class="card">
        <div class="card-title" style="display:flex;justify-content:space-between;align-items:center">
          <span>학생 목록</span>
          <button class="btn btn-primary" id="openStudentAddBtn">+ 학생 추가</button>
        </div>
        <table>
          <thead><tr><th>이름</th><th>반</th><th>연락처</th><th>관리</th></tr></thead>
          <tbody id="studentTableBody"></tbody>
        </table>
      </div>
    </div>

    <!-- 반 관리 -->
    <div id="tabClasses" class="hidden">
      <div class="card">
        <div class="card-title">반 추가</div>
        <div class="row">
          <input type="text" id="newClassName" placeholder="반 이름 (예: 월수반)">
          <button class="btn btn-primary" id="addClassBtn">추가</button>
        </div>
      </div>
      <div class="card">
        <div class="card-title">반 목록</div>
        <div id="classList"></div>
      </div>
    </div>

  </div>
</div>

<!-- 학생 추가/수정 모달 -->
<div class="modal-ov" id="studentModal">
  <div class="modal-bx">
    <div class="modal-hd"><b id="studentModalTitle">학생 추가</b><button id="studentModalCloseBtn">&times;</button></div>
    <div class="modal-bd">
      <input type="hidden" id="stuEditId">
      <label>이름 *</label>
      <input type="text" id="stuNameInput" placeholder="학생 이름" class="mb-3">
      <label>반</label>
      <select id="stuClassInput" class="mb-3"><option value="">반 없음</option></select>
      <label>연락처</label>
      <input type="text" id="stuPhoneInput" placeholder="010-0000-0000">
      <div class="err hidden" id="stuModalErr"></div>
    </div>
    <div class="modal-ft">
      <button class="btn btn-secondary" id="studentModalCancelBtn">취소</button>
      <button class="btn btn-primary" id="studentModalSaveBtn">저장</button>
    </div>
  </div>
</div>

<script>
// =========================================================
// 설정 — 본인 값으로 교체하세요
// =========================================================
const SUPABASE_URL = 'https://obgdwtsykchxjbtvqssn.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9iZ2R3dHN5a2NoeGpidHZxc3NuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYzNjEwMzEsImV4cCI6MjEwMTkzNzAzMX0.T8NuPqDk1NZfawzP9sIJGu2iyJYFlGPLvMt4T2cuPpQ';
const TEACHER_PW   = '2424'; // 선생님 페이지 접속 비밀번호 (원하는 값으로 변경)

const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_KEY);

// =========================================================
// 로그인 게이트
// =========================================================
document.getElementById('pwBtn').addEventListener('click', tryLogin);
document.getElementById('pwInput').addEventListener('keydown', e => { if (e.key === 'Enter') tryLogin(); });
function tryLogin() {
  const val = document.getElementById('pwInput').value;
  if (val === TEACHER_PW) {
    sessionStorage.setItem('teacher_ok', '1');
    document.getElementById('screenLogin').classList.add('hidden');
    document.getElementById('screenMain').classList.remove('hidden');
    initAll();
  } else {
    document.getElementById('pwErr').classList.remove('hidden');
  }
}
if (sessionStorage.getItem('teacher_ok') === '1') {
  document.getElementById('screenLogin').classList.add('hidden');
  document.getElementById('screenMain').classList.remove('hidden');
  initAll();
}

// =========================================================
// 탭 전환
// =========================================================
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    ['Worksheets','Results','Students','Classes'].forEach(name => {
      document.getElementById('tab' + name).classList.toggle('hidden', 'tab' + name !== 'tab' + capitalize(tab.dataset.tab));
    });
  });
});
function capitalize(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

let allClasses = [];
let allTags = [];

function initAll() {
  loadClasses();
  loadTags();
  loadWorksheetsList();
  loadStudentList();
  loadResultClassOptions();
}

// =========================================================
// 반 관리
// =========================================================
async function loadClasses() {
  const { data } = await db.from('classes').select('*').order('created_at');
  allClasses = data || [];
  renderClassList();
  renderNewStudentClassSelect();
}
function renderClassList() {
  const el = document.getElementById('classList');
  el.innerHTML = '';
  allClasses.forEach(c => {
    const div = document.createElement('div');
    div.className = 'list-item';
    div.innerHTML = `<span class="name">${c.name}</span>`;
    const btns = document.createElement('div');
    const renameBtn = document.createElement('button');
    renameBtn.className = 'btn btn-secondary'; renameBtn.textContent = '이름변경'; renameBtn.style.marginRight='6px';
    renameBtn.onclick = async () => {
      const name = prompt('새 반 이름', c.name);
      if (name && name.trim()) { await db.from('classes').update({name:name.trim()}).eq('id', c.id); loadClasses(); }
    };
    const delBtn = document.createElement('button');
    delBtn.className = 'btn btn-danger'; delBtn.textContent = '삭제';
    delBtn.onclick = async () => {
      if (!confirm('이 반을 삭제할까요?')) return;
      await db.from('classes').delete().eq('id', c.id);
      loadClasses();
    };
    btns.appendChild(renameBtn); btns.appendChild(delBtn);
    div.appendChild(btns);
    el.appendChild(div);
  });
}
document.getElementById('addClassBtn').addEventListener('click', async () => {
  const input = document.getElementById('newClassName');
  if (!input.value.trim()) return;
  await db.from('classes').insert({ name: input.value.trim() });
  input.value = '';
  loadClasses();
});

// =========================================================
// 학생 관리
// =========================================================
function renderNewStudentClassSelect() {
  const sel = document.getElementById('stuClassInput');
  if (!sel) return;
  const prev = sel.value;
  sel.innerHTML = '<option value="">반 없음</option>';
  allClasses.forEach(c => {
    const opt = document.createElement('option');
    opt.value = c.id; opt.textContent = c.name;
    sel.appendChild(opt);
  });
  if (prev) sel.value = prev;
}

function openStudentModal(student) {
  document.getElementById('stuModalErr').classList.add('hidden');
  document.getElementById('studentModalTitle').textContent = student ? '학생 수정' : '학생 추가';
  document.getElementById('stuEditId').value = student ? student.id : '';
  document.getElementById('stuNameInput').value = student ? student.name : '';
  document.getElementById('stuClassInput').value = student ? (student.class_id || '') : '';
  document.getElementById('stuPhoneInput').value = student ? (student.phone || '') : '';
  document.getElementById('studentModal').classList.add('show');
}
function closeStudentModal() {
  document.getElementById('studentModal').classList.remove('show');
}
document.getElementById('openStudentAddBtn').addEventListener('click', () => openStudentModal(null));
document.getElementById('studentModalCloseBtn').addEventListener('click', closeStudentModal);
document.getElementById('studentModalCancelBtn').addEventListener('click', closeStudentModal);
document.getElementById('studentModalSaveBtn').addEventListener('click', async () => {
  const id = document.getElementById('stuEditId').value;
  const name = document.getElementById('stuNameInput').value.trim();
  const classId = document.getElementById('stuClassInput').value || null;
  const phone = document.getElementById('stuPhoneInput').value.trim();
  const errEl = document.getElementById('stuModalErr');
  errEl.classList.add('hidden');
  if (!name) { errEl.textContent = '이름을 입력해주세요'; errEl.classList.remove('hidden'); return; }

  const payload = { name, class_id: classId, phone: phone || null };
  const { error } = id
    ? await db.from('students').update(payload).eq('id', id)
    : await db.from('students').insert(payload);
  if (error) { errEl.textContent = '저장 실패: ' + error.message; errEl.classList.remove('hidden'); return; }
  closeStudentModal();
  loadStudentList();
});

async function loadStudentList() {
  const { data } = await db
    .from('students')
    .select('id, name, class_id, phone, classes(id, name)')
    .order('created_at');
  const tbody = document.getElementById('studentTableBody');
  tbody.innerHTML = '';
  (data || []).forEach(s => {
    const tr = document.createElement('tr');
    const className = s.classes ? s.classes.name : '-';
    tr.innerHTML = `<td>${s.name}</td><td>${className}</td><td>${s.phone || '-'}</td>`;
    const tdActions = document.createElement('td');
    tdActions.className = 'table-actions';
    const editBtn = document.createElement('button');
    editBtn.className = 'btn btn-secondary'; editBtn.textContent = '수정';
    editBtn.onclick = () => openStudentModal(s);
    const delBtn = document.createElement('button');
    delBtn.className = 'btn btn-danger'; delBtn.textContent = '삭제';
    delBtn.onclick = async () => {
      if (!confirm(s.name + ' 학생을 삭제할까요?')) return;
      await db.from('students').delete().eq('id', s.id);
      loadStudentList();
    };
    tdActions.appendChild(editBtn); tdActions.appendChild(delBtn);
    tr.appendChild(tdActions);
    tbody.appendChild(tr);
  });
}

// =========================================================
// 태그
// =========================================================
async function loadTags() {
  const { data } = await db.from('tags').select('*').order('created_at');
  allTags = data || [];
}
async function addTag(name) {
  const { data } = await db.from('tags').insert({ name }).select().single();
  allTags.push(data);
  return data;
}

// =========================================================
// 학습지 관리
// =========================================================
async function loadWorksheetsList() {
  const { data } = await db.from('worksheets').select('*, questions(id)').order('created_at', { ascending:false });
  const el = document.getElementById('wsList');
  el.innerHTML = '';
  (data || []).forEach(w => {
    const div = document.createElement('div');
    div.className = 'list-item';
    div.innerHTML = `<span class="name">${w.title} <span class="meta">(${(w.questions||[]).length}문항)</span></span>`;
    const btns = document.createElement('div');
    const editBtn = document.createElement('button');
    editBtn.className = 'btn btn-secondary'; editBtn.textContent = '편집'; editBtn.style.marginRight = '6px';
    editBtn.onclick = () => openWorksheetEditor(w.id);
    const cloneBtn = document.createElement('button');
    cloneBtn.className = 'btn btn-secondary'; cloneBtn.textContent = '복제'; cloneBtn.style.marginRight = '6px';
    cloneBtn.onclick = async () => { await cloneWorksheet(w.id); };
    const delBtn = document.createElement('button');
    delBtn.className = 'btn btn-danger'; delBtn.textContent = '삭제';
    delBtn.onclick = async () => {
      if (!confirm('이 학습지를 삭제할까요?')) return;
      await db.from('worksheets').delete().eq('id', w.id);
      loadWorksheetsList();
    };
    btns.appendChild(editBtn); btns.appendChild(cloneBtn); btns.appendChild(delBtn);
    div.appendChild(btns);
    el.appendChild(div);
  });
}
async function cloneWorksheet(id) {
  const { data: original } = await db.from('worksheets').select('*, questions(*)').eq('id', id).single();
  const { data: clone } = await db.from('worksheets').insert({ title: original.title + ' (복사본)' }).select().single();
  if (original.questions?.length) {
    await db.from('questions').insert(original.questions.map(q => ({
      worksheet_id: clone.id, question_no: q.question_no, type: q.type,
      correct_choice: q.correct_choice, correct_value: q.correct_value,
      tolerance: q.tolerance, tag_id: q.tag_id
    })));
  }
  loadWorksheetsList();
}

document.getElementById('newWsBtn').addEventListener('click', () => openWorksheetEditor(null));

let editorQuestions = [];
let editorWorksheetId = null;

async function openWorksheetEditor(id) {
  editorWorksheetId = id;
  document.getElementById('wsListView').classList.add('hidden');
  const view = document.getElementById('wsEditorView');
  view.classList.remove('hidden');

  let title = '';
  let assignedClassIds = [];
  if (id) {
    const { data: w } = await db.from('worksheets').select('*, questions(*)').eq('id', id).single();
    title = w.title;
    editorQuestions = (w.questions || []).sort((a,b)=>a.question_no-b.question_no).map(q => ({
      type: q.type, correct_choice: q.correct_choice, correct_value: q.correct_value || '',
      tolerance: q.tolerance ?? 0.001, tag_id: q.tag_id || ''
    }));
    const { data: wc } = await db.from('worksheet_classes').select('class_id').eq('worksheet_id', id);
    assignedClassIds = (wc || []).map(r => r.class_id);
  } else {
    editorQuestions = [emptyQuestion()];
  }

  renderEditor(title, assignedClassIds);
}
function emptyQuestion() { return { type:'mc', correct_choice:1, correct_value:'', tolerance:0.001, tag_id:'' }; }

function renderEditor(title, assignedClassIds) {
  const view = document.getElementById('wsEditorView');
  view.innerHTML = '';

  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <div class="card-title">${editorWorksheetId ? '학습지 편집' : '새 학습지'}</div>
    <label>학습지 제목</label>
    <input type="text" id="wsTitleInput" class="mb-3" value="${title.replace(/"/g,'&quot;')}">
    <div class="row mb-3">
      <div style="flex:1">
        <label>문항 수</label>
        <input type="number" id="wsQCount" min="1" value="${editorQuestions.length}">
      </div>
    </div>
    <label>실수 유형 태그 추가</label>
    <div class="row mb-3">
      <input type="text" id="newTagInput" placeholder="예: 부호 실수">
      <button class="btn btn-secondary" id="addTagBtn">추가</button>
    </div>
  `;
  view.appendChild(card);

  const qContainer = document.createElement('div');
  qContainer.id = 'qContainer';
  view.appendChild(qContainer);
  renderQuestionBoxes();

  const addBtn = document.createElement('button');
  addBtn.className = 'btn btn-secondary mb-3';
  addBtn.textContent = '+ 문항 추가';
  addBtn.onclick = () => { editorQuestions.push(emptyQuestion()); document.getElementById('wsQCount').value = editorQuestions.length; renderQuestionBoxes(); };
  view.appendChild(addBtn);

  // 배정
  const assignCard = document.createElement('div');
  assignCard.className = 'card';
  assignCard.innerHTML = `<div class="card-title">배정할 반</div><div id="assignChips"></div>`;
  view.appendChild(assignCard);
  const assignChips = assignCard.querySelector('#assignChips');
  let selectedAssign = [...assignedClassIds];
  function renderAssignChips() {
    assignChips.innerHTML = '';
    allClasses.forEach(c => {
      const chip = document.createElement('span');
      chip.className = 'chip' + (selectedAssign.includes(c.id) ? ' selected' : '');
      chip.textContent = c.name;
      chip.onclick = () => {
        selectedAssign = selectedAssign.includes(c.id) ? selectedAssign.filter(x=>x!==c.id) : [...selectedAssign, c.id];
        renderAssignChips();
      };
      assignChips.appendChild(chip);
    });
  }
  renderAssignChips();

  const saveRow = document.createElement('div');
  saveRow.className = 'row';
  const saveBtn = document.createElement('button');
  saveBtn.className = 'btn btn-primary btn-block';
  saveBtn.textContent = '저장';
  saveBtn.onclick = () => saveWorksheet(selectedAssign);
  const cancelBtn = document.createElement('button');
  cancelBtn.className = 'btn btn-secondary';
  cancelBtn.textContent = '취소';
  cancelBtn.style.marginLeft = '8px';
  cancelBtn.onclick = closeEditor;
  saveRow.appendChild(saveBtn); saveRow.appendChild(cancelBtn);
  view.appendChild(saveRow);
  const errDiv = document.createElement('div'); errDiv.id = 'wsErr'; errDiv.className='err hidden';
  view.appendChild(errDiv);

  document.getElementById('wsQCount').addEventListener('change', (e) => {
    const n = Math.max(1, Number(e.target.value) || 1);
    while (editorQuestions.length < n) editorQuestions.push(emptyQuestion());
    while (editorQuestions.length > n) editorQuestions.pop();
    renderQuestionBoxes();
  });
  document.getElementById('addTagBtn').addEventListener('click', async () => {
    const input = document.getElementById('newTagInput');
    if (!input.value.trim()) return;
    await addTag(input.value.trim());
    input.value = '';
    renderQuestionBoxes();
  });
}

function renderQuestionBoxes() {
  const container = document.getElementById('qContainer');
  container.innerHTML = '';
  editorQuestions.forEach((q, idx) => {
    const box = document.createElement('div');
    box.className = 'q-box';
    const head = document.createElement('div');
    head.className = 'q-head';
    head.innerHTML = `<b>${idx+1}번 문항</b>`;
    const delLink = document.createElement('span');
    delLink.className = 'link-danger'; delLink.textContent = '삭제';
    delLink.onclick = () => { editorQuestions.splice(idx,1); document.getElementById('wsQCount').value = editorQuestions.length; renderQuestionBoxes(); };
    head.appendChild(delLink);
    box.appendChild(head);

    const radioRow = document.createElement('div');
    radioRow.className = 'radio-row';
    radioRow.innerHTML = `
      <label style="display:flex;align-items:center;gap:4px;"><input type="radio" name="type${idx}" ${q.type==='mc'?'checked':''}> 객관식(5지선다)</label>
      <label style="display:flex;align-items:center;gap:4px;"><input type="radio" name="type${idx}" ${q.type==='short'?'checked':''}> 주관식</label>
    `;
    const radios = radioRow.querySelectorAll('input[type=radio]');
    radios[0].onchange = () => { q.type = 'mc'; renderQuestionBoxes(); };
    radios[1].onchange = () => { q.type = 'short'; renderQuestionBoxes(); };
    box.appendChild(radioRow);

    if (q.type === 'mc') {
      const sel = document.createElement('div');
      sel.className = 'choice-select';
      for (let n=1;n<=5;n++) {
        const b = document.createElement('button');
        b.type='button'; b.textContent = n;
        if (q.correct_choice === n) b.classList.add('selected');
        b.onclick = () => { q.correct_choice = n; renderQuestionBoxes(); };
        sel.appendChild(b);
      }
      box.appendChild(sel);
    } else {
      const grid = document.createElement('div');
      grid.className = 'grid2';
      grid.innerHTML = `
        <div><label>정답</label><input type="text" class="ansInput" placeholder="예: 1/2, 2√3, x>1" value="${(q.correct_value||'').replace(/"/g,'&quot;')}"></div>
        <div><label>허용 오차</label><input type="number" step="0.001" class="tolInput" value="${q.tolerance}"></div>
      `;
      grid.querySelector('.ansInput').addEventListener('input', e => q.correct_value = e.target.value);
      grid.querySelector('.tolInput').addEventListener('input', e => q.tolerance = Number(e.target.value));
      box.appendChild(grid);
    }

    const tagWrap = document.createElement('div');
    tagWrap.className = 'mt-2';
    tagWrap.innerHTML = `<label>실수 유형 태그</label>`;
    const tagSel = document.createElement('select');
    const noneOpt = document.createElement('option'); noneOpt.value=''; noneOpt.textContent='태그 없음';
    tagSel.appendChild(noneOpt);
    allTags.forEach(t => {
      const opt = document.createElement('option'); opt.value = t.id; opt.textContent = t.name;
      if (q.tag_id === t.id) opt.selected = true;
      tagSel.appendChild(opt);
    });
    tagSel.addEventListener('change', e => q.tag_id = e.target.value);
    tagWrap.appendChild(tagSel);
    box.appendChild(tagWrap);

    container.appendChild(box);
  });
}

async function saveWorksheet(assignedClassIds) {
  const errEl = document.getElementById('wsErr');
  errEl.classList.add('hidden');
  const title = document.getElementById('wsTitleInput').value.trim();
  if (!title) { errEl.textContent = '학습지 제목을 입력하세요.'; errEl.classList.remove('hidden'); return; }
  for (const q of editorQuestions) {
    if (q.type === 'short' && !String(q.correct_value||'').trim()) {
      errEl.textContent = '모든 주관식 문항에 정답을 입력하세요.'; errEl.classList.remove('hidden'); return;
    }
  }

  let worksheetId = editorWorksheetId;
  if (worksheetId) {
    await db.from('worksheets').update({ title }).eq('id', worksheetId);
    await db.from('questions').delete().eq('worksheet_id', worksheetId);
  } else {
    const { data: w, error } = await db.from('worksheets').insert({ title }).select().single();
    if (error) { errEl.textContent = '저장 실패: ' + error.message; errEl.classList.remove('hidden'); return; }
    worksheetId = w.id;
  }

  const rows = editorQuestions.map((q, idx) => ({
    worksheet_id: worksheetId, question_no: idx+1, type: q.type,
    correct_choice: q.type === 'mc' ? q.correct_choice : null,
    correct_value: q.type === 'short' ? String(q.correct_value).trim() : null,
    tolerance: q.tolerance ?? 0.001,
    tag_id: q.tag_id || null
  }));
  await db.from('questions').insert(rows);

  await db.from('worksheet_classes').delete().eq('worksheet_id', worksheetId);
  if (assignedClassIds.length > 0) {
    await db.from('worksheet_classes').insert(assignedClassIds.map(class_id => ({ worksheet_id: worksheetId, class_id })));
  }

  closeEditor();
  loadWorksheetsList();
}
function closeEditor() {
  document.getElementById('wsEditorView').classList.add('hidden');
  document.getElementById('wsListView').classList.remove('hidden');
}

async function loadResultClassOptions() {
  const sel = document.getElementById('resultClassSelect');
  sel.innerHTML = '<option value="">전체 반</option>';
  allClasses.forEach(c => {
    const opt = document.createElement('option'); opt.value = c.id; opt.textContent = c.name;
    sel.appendChild(opt);
  });
}
document.getElementById('resultClassSelect').addEventListener('change', loadResultStudentOptions);
document.getElementById('resultStudentSelect').addEventListener('change', loadResultDetail);

async function loadResultStudentOptions() {
  const classId = document.getElementById('resultClassSelect').value;
  const sel = document.getElementById('resultStudentSelect');
  sel.innerHTML = '<option value="">학생 선택</option>';
  document.getElementById('resultDetail').innerHTML = '';

  let students;
  if (classId) {
    const { data } = await db.from('students').select('id, name').eq('class_id', classId);
    students = data || [];
  } else {
    const { data } = await db.from('students').select('id, name');
    students = data || [];
  }
  students.sort((a,b)=>a.name.localeCompare(b.name)).forEach(s => {
    const opt = document.createElement('option'); opt.value = s.id; opt.textContent = s.name;
    sel.appendChild(opt);
  });
}

async function loadResultDetail() {
  const studentId = document.getElementById('resultStudentSelect').value;
  const detailEl = document.getElementById('resultDetail');
  detailEl.innerHTML = '';
  if (!studentId) return;

  const { data: attempts } = await db
    .from('attempts')
    .select('id, worksheet_id, attempt_no, wrong_count, passed, worksheets(title)')
    .eq('student_id', studentId)
    .order('attempt_no');

  const byWs = {};
  (attempts||[]).forEach(a => {
    const key = a.worksheet_id;
    if (!byWs[key]) byWs[key] = { title: a.worksheets?.title || '(삭제된 학습지)', rows: [] };
    byWs[key].rows.push(a);
  });

  Object.values(byWs).forEach(w => {
    const wrap = document.createElement('div'); wrap.className = 'mb-3';
    let rowsHtml = w.rows.map(a => `<tr><td>${a.attempt_no}차</td><td>${a.wrong_count}개</td><td>${a.passed ? '<span style="color:#16a34a">통과</span>' : '<span style="color:#ef4444">재시도</span>'}</td></tr>`).join('');
    wrap.innerHTML = `<b style="font-size:13px;">${w.title}</b><table class="mt-2"><thead><tr><th>시도</th><th>틀린 문항 수</th><th>결과</th></tr></thead><tbody>${rowsHtml}</tbody></table>`;
    detailEl.appendChild(wrap);
  });
  if (Object.keys(byWs).length === 0) {
    detailEl.innerHTML = '<p style="font-size:13px;color:#999;">아직 푼 학습지가 없습니다.</p>';
    return;
  }

  const attemptIds = (attempts||[]).map(a => a.id);
  if (attemptIds.length > 0) {
    const { data: wrongAnswers } = await db
      .from('attempt_answers')
      .select('questions(tag_id, tags(name))')
      .in('attempt_id', attemptIds)
      .eq('is_correct', false);
    const counts = {};
    (wrongAnswers||[]).forEach(r => {
      const tag = r.questions?.tags;
      if (!tag) return;
      counts[tag.name] = (counts[tag.name]||0) + 1;
    });
    const tagStats = Object.entries(counts).sort((a,b)=>b[1]-a[1]);
    if (tagStats.length > 0) {
      const tagWrap = document.createElement('div');
      tagWrap.innerHTML = '<b style="font-size:13px;">유형별 오답 경향</b>' +
        tagStats.map(([name,count]) => `<div style="display:flex;justify-content:space-between;font-size:13px;padding:4px 0;"><span>${name}</span><span style="color:#999;">${count}회</span></div>`).join('');
      detailEl.appendChild(tagWrap);
    }
  }
}
